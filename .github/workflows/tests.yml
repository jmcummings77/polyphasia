name: Testing

on:
  push:
    branches:
      - main
      - primary
      - develop
  pull_request:

jobs:
  Linting:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Linting
        run: uv run --frozen pre-commit run --all-files

  Test-Build:
    needs: Linting
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock
    - name: Install dependencies
      run: uv sync --frozen
    - name: Test
      run: uv run --frozen ./run_tests.sh
    - name: Build distributions
      run: uv build
    - name: Smoke test installed wheel outside the checkout
      run: |
        cd "$(mktemp -d)"
        uv run --isolated --no-project --python 3.12 --with "$GITHUB_WORKSPACE"/dist/*.whl python - <<'PY'
        import os
        from pathlib import Path
        from polyphasia.graph import DirectedGraph
        from polyphasia.loader import clean_data_frame, load_to_pandas

        source = Path(os.environ["GITHUB_WORKSPACE"]) / "examples" / "sample.tsv"
        graph = DirectedGraph(clean_data_frame(load_to_pandas(source)))
        assert graph.info == "DiGraph with 4 nodes and 3 edges"
        assert graph.is_dag
        assert graph.language_subgraph().number_of_edges() == 3
        PY

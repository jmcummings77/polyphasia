name: Testing

on:
  push:
    branches:
      - main
      - primary
      - develop
  pull_request:

jobs:
  Linting:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Linting
        run: uv run --frozen pre-commit run --all-files

  Test-Build:
    needs: Linting
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock
    - name: Install dependencies
      run: uv sync --frozen --extra analysis
    - name: Test
      run: uv run --frozen --extra analysis ./run_tests.sh
    - name: Build distributions
      run: uv build
    - name: Smoke test installed wheel outside the checkout
      run: |
        cd "$(mktemp -d)"
        uv run --isolated --no-project --refresh-package polyphasia --python 3.12 --with "$GITHUB_WORKSPACE"/dist/*.whl python - <<'PY'
        import os
        from pathlib import Path
        import polyphasia
        from polyphasia.assertions import prepare_assertions, project_assertions
        from polyphasia.graph import DirectedGraph
        from polyphasia.loader import clean_data_frame, load_to_pandas
        from polyphasia.queries import ancestor_subgraph, root_family_subgraph

        workspace = Path(os.environ["GITHUB_WORKSPACE"])
        assert not Path(polyphasia.__file__).resolve().is_relative_to(workspace)
        source = workspace / "examples" / "sample.tsv"
        graph = DirectedGraph(clean_data_frame(load_to_pandas(source)))
        assert graph.info == "DiGraph with 4 nodes and 3 edges"
        assert graph.is_dag
        assert graph.language_subgraph().number_of_edges() == 3
        projected = project_assertions(prepare_assertions(load_to_pandas(source)), policy="normalized")
        assert set(ancestor_subgraph(projected, ["eng: example"])) == {"lat: exemplum", "eng: example"}
        assert len(root_family_subgraph(projected, ["eng: example"])) == 4
        assert projected["lat: exemplum"]["eng: example"]["assertion_ids"] == (1,)
        PY

  Notebook:
    needs: Linting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock
    - name: Install notebook dependencies
      run: uv sync --frozen --extra notebooks
    - name: Generate synthetic analysis artifacts
      run: >-
        uv run --frozen --extra notebooks python -m polyphasia.analysis
        examples/analysis-fixture.tsv --output .analysis-ci/run
        --language eng --word 'eng: examples' --word 'eng: loop-leaf'
        --input-kind synthetic --dataset-version synthetic-v1
    - name: Execute analysis notebook in a fresh kernel
      run: >-
        uv run --frozen --extra notebooks python scripts/execute_analysis_notebook.py
        --artifacts .analysis-ci/run
        --output .analysis-ci/verified_analysis.executed.ipynb
    - name: Upload analysis evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: synthetic-analysis
        path: .analysis-ci/
        include-hidden-files: true
        if-no-files-found: warn
